<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JO3T app icon">
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8C3B"/>
      <stop offset="0.55" stop-color="#F2630F"/>
      <stop offset="1" stop-color="#C23E06"/>
    </linearGradient>
    <mask id="cutlery">
      <rect width="1024" height="1024" fill="white"/>
      <g fill="black">
        <rect x="452" y="338" width="13" height="58" rx="6"/>
        <rect x="473" y="338" width="13" height="58" rx="6"/>
        <rect x="494" y="338" width="13" height="58" rx="6"/>
        <rect x="466" y="384" width="27" height="14" rx="7"/>
        <rect x="472" y="392" width="15" height="150" rx="7.5"/>
