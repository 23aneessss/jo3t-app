name: jo3t
description: Algeria's community-driven food & venue discovery app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Animations — the heart of the UI
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Fonts & icons
  google_fonts: ^6.2.1

  # Images
  cached_network_image: ^3.4.1

  # Functional programming / Either type
  dartz: ^0.10.1

  # Local cache / offline
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Media
  image_picker: ^1.1.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.3.5
  firebase_analytics: ^11.4.5
  cloud_functions: ^5.2.1

  # Maps
  google_maps_flutter: ^2.9.0

  # Local notifications (FCM foreground display)
  flutter_local_notifications: ^18.0.1

  # Utilities
  timeago: ^3.7.0
  intl: ^0.20.2
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#E8520A"
  adaptive_icon_foreground: "assets/branding/icon_fg.png"

flutter:
  uses-material-design: true
  fonts:
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri.ttf
