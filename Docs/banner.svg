<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JO3T — discover Algeria's best places to eat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B2B"/>
      <stop offset="0.5" stop-color="#E8520A"/>
      <stop offset="1" stop-color="#9E3006"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8C5B"/>
      <stop offset="1" stop-color="#B33E06"/>
    </linearGradient>
    <pattern id="dots" width="46" height="58" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="14" r="7" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <circle cx="1010" cy="70" r="180" fill="#ffffff" opacity="0.045"/>
  <circle cx="150" cy="380" r="120" fill="#ffffff" opacity="0.045"/>

  <!-- logo tile -->
  <g transform="translate(96,120)">
    <rect width="180" height="180" rx="44" fill="#FFFFFF" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <!-- orange location pin -->
    <path d="M90 150 C58 116 36 102 36 72 A54 54 0 1 1 144 72 C144 102 122 116 90 150 Z" fill="#E8520A"/>
    <!-- cutlery (white, reads as cut-out) -->
    <g fill="#FFFFFF">
      <rect x="72" y="44" width="3.5" height="15" rx="1.75"/>
      <rect x="78.5" y="44" width="3.5" height="15" rx="1.75"/>
      <rect x="85" y="44" width="3.5" height="15" rx="1.75"/>
      <rect x="76.5" y="57" width="7.5" height="4" rx="2"/>
      <rect x="78.5" y="60" width="4" height="34" rx="2"/>
      <path d="M104 44 c7 0 8 11 8 21 c0 7 -4 9 -8 9 Z"/>
      <rect x="102" y="70" width="4" height="24" rx="2"/>
    </g>
  </g>

  <!-- wordmark + copy -->
  <text x="320" y="150" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="600" fill="#ffffff" opacity="0.9">جعت</text>
  <text x="318" y="246" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="-2" fill="#ffffff">JO3T</text>
  <text x="322" y="296" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="500" fill="#ffffff" opacity="0.95">Discover Algeria&#8217;s best places to eat — recommended by real Algerians.</text>

  <!-- category pills -->
  <g font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#ffffff">
    <g transform="translate(322,330)">
      <rect width="130" height="40" rx="20" fill="#ffffff" opacity="0.16"/>
      <text x="65" y="26" text-anchor="middle">Restaurants</text>
    </g>
    <g transform="translate(464,330)">
      <rect width="92" height="40" rx="20" fill="#ffffff" opacity="0.16"/>
      <text x="46" y="26" text-anchor="middle">Cafés</text>
    </g>
    <g transform="translate(568,330)">
      <rect width="138" height="40" rx="20" fill="#ffffff" opacity="0.16"/>
      <text x="69" y="26" text-anchor="middle">Street food</text>
    </g>
    <g transform="translate(718,330)">
      <rect width="132" height="40" rx="20" fill="#ffffff" opacity="0.16"/>
      <text x="66" y="26" text-anchor="middle">48 Wilayas</text>
    </g>
  </g>
</svg>
